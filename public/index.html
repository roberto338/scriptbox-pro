<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptBox Pro - Générateur de Scripts IA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { font-size: 1.1em; opacity: 0.9; }
    
    .content {
      padding: 40px;
    }
    
    .pricing {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin: 40px 0;
    }
    .plan {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s;
    }
    .plan:hover {
      border-color: #667eea;
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
    }
    .plan h3 { font-size: 1.5em; margin: 15px 0; }
    .price {
      font-size: 2.5em;
      color: #667eea;
      font-weight: bold;
      margin: 15px 0;
    }
    .price-period { font-size: 0.9em; color: #666; }
    .features {
      text-align: left;
      margin: 20px 0;
      font-size: 0.95em;
    }
    .features li { margin: 10px 0; }
    
    .form-group {
      margin: 15px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      background: #667eea;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      font-weight: 600;
      margin-top: 10px;
    }
    button:hover { background: #5568d3; }
    
    .form-section {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 8px;
      margin-top: 40px;
    }
    .form-section h2 {
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    
    .message {
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    @media (max-width: 768px) {
      .pricing { grid-template-columns: 1fr; }
      h1 { font-size: 1.8em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ScriptBox Pro</h1>
      <p class="subtitle">Générez des scripts avec l'IA en secondes</p>
    </header>
    
    <div class="content">
      <div class="pricing">
        <div class="plan">
          <h3>Starter</h3>
          <div class="price">29€<span class="price-period">/mois</span></div>
          <ul class="features">
            <li>✓ 100 scripts/mois</li>
            <li>✓ Modèles de base</li>
            <li>✓ Support email</li>
          </ul>
        </div>
        <div class="plan">
          <h3>Pro</h3>
          <div class="price">79€<span class="price-period">/mois</span></div>
          <ul class="features">
            <li>✓ Scripts illimités</li>
            <li>✓ Tous les modèles</li>
            <li>✓ Support prioritaire</li>
            <li>✓ API access</li>
          </ul>
        </div>
      </div>

      <div class="form-section">
        <h2>Rejoignez la waitlist</h2>
        <form id="waitlistForm">
          <div class="form-group">
            <label for="name">Votre nom</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="plan">Plan intéressé</label>
            <select id="plan" required>
              <option value="">-- Sélectionnez --</option>
              <option value="29">Starter (29€/mois)</option>
              <option value="79">Pro (79€/mois)</option>
            </select>
          </div>
          <button type="submit">Rejoindre la waitlist</button>
          <div id="message" class="message"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('waitlistForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const plan = document.getElementById('plan').value;
      const messageDiv = document.getElementById('message');

      try {
        const response = await fetch('/api/waitlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, plan })
        });
        
        if (response.ok) {
          messageDiv.textContent = '✓ Merci ! Vous êtes inscrit à la waitlist.';
          messageDiv.className = 'message success';
          document.getElementById('waitlistForm').reset();
        } else {
          throw new Error('Erreur du serveur');
        }
      } catch (err) {
        messageDiv.textContent = '✗ Erreur : ' + err.message;
        messageDiv.className = 'message error';
      }
      messageDiv.style.display = 'block';
    });
  </script>
</body>
</html>
