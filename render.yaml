services:
  - type: web
    name: scriptbox-pro
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scriptbox-pro-db
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_LIST_ID
        value: "2"

databases:
  - name: scriptbox-pro-db
    engine: postgres
